general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    inhibit_sleep = 3
    ignore_dbus_inhibit = false
}

# Auto-lock on idle disabled at user request (2026-11-13).
# Manual lock (SUPER+L) and lock-on-suspend (before_sleep_cmd) still work.
# To re-enable, uncomment the listener below (backup in .dsh-backup/).
# Note: with no listeners hypridle logs "No rules configured"; harmless.
