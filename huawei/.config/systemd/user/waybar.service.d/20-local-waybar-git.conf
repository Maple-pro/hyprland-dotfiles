# Hyprland 0.55+ with the Lua config provider rejects Waybar 0.15.0's legacy
# workspace dispatch, so clicks on hyprland/workspaces buttons do nothing.
# The wrapper prefers the Lua-IPC-compatible build installed by
# huawei/update-waybar-git.sh and falls back to /usr/bin/waybar.
[Service]
ExecStart=
ExecStart=%h/.local/bin/waybar
