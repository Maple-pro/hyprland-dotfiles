--force-device-scale-factor=1
--password-store=kwallet6
# GPU-composited frames reach the Wayland compositor blank on this Intel/i915
# session: Super+F turned the panel black while the compositor itself kept
# rendering correctly (screencaptures were fine) and only Chromium was hit.
# Software compositing keeps GPU rasterisation and video decode and fixes it.
# Re-test after a Chromium or Mesa upgrade before removing this line.
--disable-gpu-compositing
